<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>revui</title>
    <style>
      :root { color-scheme: light; --logo-back: #5b6ee1; --logo-body: #08090c; --logo-check: #f3f4f8; --bg: #f6f5f0; --raised: #fff; --line: #d6d4ca; --dim: #6c6d65; --text: #3a3b36; --ink: #0b0b0b; --rust: #6b3a2a; }
      @media (prefers-color-scheme: dark) {
        :root { color-scheme: dark; --bg: #161614; --raised: #1f1f1c; --line: #3a3a35; --dim: #9c9c92; --text: #cdccc4; --ink: #f1f0ea; --rust: #c47a5a; --logo-back: #a9acf7; --logo-body: #f3f4f8; --logo-check: #08090c; }
        button.primary { color: #0b0b0b !important; }
      }
      * { box-sizing: border-box; }
      body { max-width: 720px; margin: 0 auto; padding: 48px 28px; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, "Helvetica Neue", sans-serif; }
      h1 { display: flex; align-items: center; gap: 10px; margin: 0 0 20px; color: var(--ink); font: 400 24px Georgia, serif; }
      h1 svg { width: 26px; height: 26px; }
      label { display: block; margin: 14px 0 5px; color: var(--ink); font-weight: 600; font-size: 13px; }
      input { width: 100%; padding: 8px 10px; border: 1px solid var(--text); background: var(--raised); font: inherit; }
      .row { display: flex; gap: 8px; }
      button { padding: 8px 13px; border: 1px solid var(--text); background: var(--raised); color: var(--ink); font: inherit; font-weight: 600; white-space: nowrap; }
      button.primary { border-color: var(--ink); background: var(--ink); color: #fff; }
      button:disabled { opacity: 0.6; }
      #problem { min-height: 20px; margin: 10px 0 0; color: var(--rust); font-size: 13px; }
      h2 { margin: 18px 0 6px; color: var(--dim); font: 500 11.5px ui-monospace, Menlo, monospace; }
      #recent { margin: 0; padding: 0; list-style: none; border: 1px solid var(--line); background: var(--raised); }
      #recent:empty { display: none; }
      #recent button { display: block; width: 100%; border: 0; border-bottom: 1px solid var(--line); text-align: left; font-weight: 400; overflow: hidden; text-overflow: ellipsis; }
      #recent li:last-child button { border-bottom: 0; }
      #recent small { display: block; color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
    </style>
  </head>
  <body>
    <h1>
      <svg viewBox="0 0 111 111" role="img" aria-label="revui"><path d="M11 3.25H74.65L107.75 36.35V100" fill="none" style="stroke: var(--logo-back)" stroke-width="6.5" /><path d="M0 11H65L100 46V111H0Z" style="fill: var(--logo-body)" /><path d="M24 64L42 82L76 48" fill="none" style="stroke: var(--logo-check)" stroke-width="11" /></svg>
      revui
    </h1>
    <form id="form">
      <label for="named">Merge request or pull request link</label>
      <div class="row">
        <input id="named" placeholder="https://gitlab.com/group/project/-/merge_requests/123" autofocus spellcheck="false" />
        <button class="primary" id="open">Open</button>
      </div>
      <p id="problem" role="alert"></p>
    </form>
    <h2 id="recent-title" hidden>YOUR REVIEWS</h2>
    <ul id="recent"></ul>
    <script>
      const { invoke } = window.__TAURI__.core
      const $ = (id) => document.getElementById(id)
      async function list() {
        const rows = JSON.parse(await invoke("reviews").catch(() => "[]"))
        const known = (row) => row.cwd || rows.find((other) => other.repo === row.repo && other.cwd)?.cwd || localStorage.getItem(`folder:${row.repo}`) || ""
        $("recent").replaceChildren(...rows.map((row) => {
          const folder = known(row)
          const item = document.createElement("li")
          const pick = document.createElement("button")
          const about = document.createElement("small")
          const state = row.working.trim() || (row.done ? "published" : row.items ? `${row.marked} of ${row.items} marked` : "no guide yet")
          pick.type = "button"
          pick.textContent = row.title || row.url
          about.textContent = [row.repo.split("/").pop() + row.reference, row.author, state, row.when].filter(Boolean).join(" · ")
          const where = document.createElement("small")
          where.textContent = folder ? `agent starts in ${folder.replace(/^\/Users\/[^/]+/, "~")}` : "asks where the code is"
          pick.append(about, where)
          pick.onclick = (event) => start(row.dir, event.metaKey, event.altKey)
          pick.title = "Cmd-click opens it in a new window. Option-click chooses another folder for the agent."
          item.append(pick)
          return item
        }))
        $("recent-title").hidden = rows.length === 0
      }
      async function start(named, newWindow = false, choose = false) {
        $("problem").textContent = ""
        $("open").disabled = true
        $("open").textContent = "Opening"
        try {
          const chosen = choose ? await invoke("pick_folder", { title: "Where should this review's agent start?" }) : null
          if (choose && !chosen) throw "No folder chosen."
          const repo = await invoke("open_review", { named, folder: chosen, newWindow })
          if (repo !== null) {
            const folder = localStorage.getItem(`folder:${repo}`) ?? (await invoke("pick_folder", { title: `Where is your checkout of ${repo || "this code"}? The agent starts there.` }))
            if (folder) {
              localStorage.setItem(`folder:${repo}`, folder)
              if ((await invoke("open_review", { named, folder, newWindow })) !== null) {
                localStorage.removeItem(`folder:${repo}`)
                throw "That folder is gone. Open the review again to choose another."
              }
            }
          }
          $("named").value = ""
        } catch (problem) {
          $("problem").textContent = String(problem)
        }
        $("open").disabled = false
        $("open").textContent = "Open"
        list()
      }
      $("form").onsubmit = (event) => {
        event.preventDefault()
        start($("named").value)
      }
      addEventListener("focus", list)
      list()
    </script>
  </body>
</html>
