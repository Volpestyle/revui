[package]
name = "revui-gpu"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "wgpu"] }
egui_extras = { version = "0.37.0", features = ["image", "file"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
lucide-icons = "1.73.0"
regex = "1.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.18"
png = "0.18"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["XmlHttpRequest", "Window", "Document", "Location", "History", "Element", "HtmlCanvasElement"] }
egui_extras = { version = "0.37", features = ["image", "http"] }
