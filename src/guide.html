<script id="bundle" type="application/json">/*BUNDLE*/</script>
<script>
// revui html: the review as one page a browser opens and steps through, with nothing beside it but a recording's
// file. What is in the bundle (review.json, the patch, pictures and diagram sources) sits in the block above, and
// this builds the page from it; the script under it is what moves between the steps.
const data = JSON.parse(document.getElementById('bundle').textContent);
const review = data.review;
const source = review.sources?.[0] ?? {};
const metric = (data.metric ?? '')
    .split(/\n(?=\{)/)
    .filter((text) => text.trim())
    .map((text) => JSON.parse(text));

const escape = (text) =>
    String(text ?? '').replace(/[&<>"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[char]);
const inline = (text) =>
    escape(text)
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
const slug = (text) =>
    String(text)
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-|-$/g, '');

// The guide's text uses a small part of Markdown: "# " headings, "- " and "1. " lists, backticks, bold.
const prose = (text) => {
    const out = [];
    let list = null;
    const close = () => {
        if (list) out.push(`</${list}>`);
        list = null;
    };
    for (const line of String(text ?? '').split('\n')) {
        const heading = line.match(/^#+\s+(.*)/);
        const bullet = line.match(/^\s*[-*]\s+(.*)/);
        const numbered = line.match(/^\s*\d+[.)]\s+(.*)/);
        if (heading) {
            close();
            out.push(`<h4>${inline(heading[1])}</h4>`);
        } else if (bullet || numbered) {

};
document.querySelector('.theme').addEventListener('click', () => theme(dark() ? 'light' : 'dark'));

// The summary card's background: a field of characters, dithered between neighbouring weights with an ordered
// (Bayer) pattern, denser towards the far corner so the title stays clear. It drifts slowly, and stands still for
// readers who ask for reduced motion.
const slab = document.querySelector('.slab');
if (slab) {
    const canvas = slab.querySelector('canvas');
    const pen = canvas.getContext('2d');
    const ramp = ' .·:-=+*#';
    const bayer = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
    const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const paint = (time) => {
        const box = slab.getBoundingClientRect();
        if (!box.width) return;
        const ratio = devicePixelRatio || 1;
        if (canvas.width !== Math.round(box.width * ratio) || canvas.height !== Math.round(box.height * ratio)) {
            canvas.width = Math.round(box.width * ratio);
            canvas.height = Math.round(box.height * ratio);
        }
        pen.setTransform(ratio, 0, 0, ratio, 0, 0);
        pen.clearRect(0, 0, box.width, box.height);
        pen.font = '11px "Geist Mono", ui-monospace, monospace';
        pen.textBaseline = 'top';
        pen.fillStyle = getComputedStyle(slab).color;
        pen.globalAlpha = 0.2;
        const [wide, tall] = [7, 13];
        const [columns, rows] = [Math.ceil(box.width / wide), Math.ceil(box.height / tall)];
        for (let row = 0; row < rows; row++) {
            for (let column = 0; column < columns; column++) {
                const [across, down] = [column / columns, row / rows];
                const wave = 0.5 + 0.5 * Math.sin(across * 5.2 + time * 0.00011 + Math.sin(down * 3.1 + time * 0.00008) * 1.7);
                const level = wave * across * across * (1 - 0.45 * down) * (ramp.length - 1);
                const lower = Math.floor(level);
                const mark = ramp[Math.min(ramp.length - 1, lower + (level - lower > (bayer[(row % 4) * 4 + (column % 4)] + 0.5) / 16 ? 1 : 0))];
                if (mark !== ' ') pen.fillText(mark, column * wide, row * tall);
            }
        }
    };
    paint(0);
    if (!still) setInterval(() => paint(performance.now()), 120);
    else addEventListener('resize', () => paint(0));
}

// A file and line (path:12) as its address on the code host.
const hosted = (at) => root.dataset.blob + at.replace(/:(\d+)$/, '#L$1');

// One step is on screen at a time; the address's #id says which, so a link to a finding opens on it.
const steps = [...document.querySelectorAll('.step')];
const below = document.querySelector('.below');
const contents = document.querySelector('.contents');
const railLinks = [...document.querySelectorAll('.frame > .rail a')];
let now = 0;
const layouts = ['side', 'below', 'off'];
let layout = 0;
try { layout = Math.max(0, layouts.indexOf(localStorage.getItem('guided-review-diff'))); } catch {}
let go = (index) => {
    now = Math.max(0, Math.min(steps.length - 1, index));
    const step = steps[now];
    steps.forEach((one) => one.classList.toggle('on', one === step));
    document.querySelector('.now').innerHTML = '<b>' + (now + 1) + ' of ' + steps.length + '</b> · ' + step.dataset.name + ' ▾';
    document.querySelector('[data-go="back"]').disabled = now === 0;
    document.querySelector('[data-go="next"]').disabled = now === steps.length - 1;
    railLinks.forEach((link, at) => { link.classList.toggle('on', at === now); if (at === now) link.scrollIntoView({ block: 'nearest' }); });
    [...contents.querySelectorAll('a')].forEach((link, at) => link.classList.toggle('on', at === now));
    const part = step.dataset.part;
    below.classList.toggle('empty', part === undefined || layouts[layout] === 'off');
    document.querySelector('.work').classList.toggle('side', layouts[layout] === 'side');

    document.querySelectorAll('.partdiff').forEach((one) => one.classList.toggle('on', one.dataset.part === part));
    document.querySelectorAll('.line.mark').forEach((line) => line.classList.remove('mark'));
    const pane = document.querySelector('.partdiff.on');
    const line = step.dataset.at && pane?.querySelector('[data-n="' + CSS.escape(step.dataset.at) + '"]');
    const head = document.querySelector('.below-head');
    head.textContent = 'diff · ' + (step.dataset.at ?? (pane ? pane.querySelectorAll('.file').length + ' files in this part' : ''));
    if (step.dataset.at && root.dataset.blob) {
        head.textContent = 'diff · ';
        head.append(Object.assign(document.createElement('a'), { href: hosted(step.dataset.at), target: '_blank', rel: 'noopener', textContent: step.dataset.at }));
    }
    if (line) { line.classList.add('mark'); line.scrollIntoView({ block: 'center' }); } else if (pane) pane.scrollTop = 0;
    step.querySelector('.text').scrollTop = 0;
    step.scrollTop = 0;
    if (location.hash !== '#' + step.id) history.replaceState(null, '', '#' + step.id);
    contents.classList.remove('open');
};
const fold = () => {
    const narrow = document.body.classList.toggle('narrow');
    try { localStorage.setItem('guided-review-rail', narrow ? 'narrow' : 'open'); } catch {}
};
try { if (localStorage.getItem('guided-review-rail') === 'narrow') document.body.classList.add('narrow'); } catch {}
const turn = (by = 1) => {
    layout = (layout + by) % layouts.length;
    try { localStorage.setItem('guided-review-diff', layouts[layout]); } catch {}
    go(now);
};
const fromHash = () => go(Math.max(0, steps.findIndex((step) => '#' + step.id === location.hash)));
addEventListener('hashchange', fromHash);
document.querySelector('.where').addEventListener('click', (event) => {
    const to = event.target.closest('[data-go]')?.dataset.go;
    if (to === 'back') go(now - 1);
    if (to === 'next') go(now + 1);
    if (to === 'contents') contents.classList.toggle('open');
    if (to === 'rail') fold();

});
contents.addEventListener('click', (event) => { if (event.target === contents) contents.classList.remove('open'); });
fromHash();

// The viewer: every figure on the page, opened large, with zoom and pan for images and diagrams and playback for
// recordings.
const viewer = document.querySelector('.viewer');
const stage = viewer.querySelector('.stage');
const media = [...document.querySelectorAll('.media')];
let at = -1;
let zoom = 1;
let x = 0;
let y = 0;
const place = () => { if (stage.firstElementChild) stage.firstElementChild.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + zoom + ')'; };
const fit = () => { zoom = 1; x = 0; y = 0; place(); };
const scale = (factor, cx = 0, cy = 0) => {
    const next = Math.min(12, Math.max(0.4, zoom * factor));
    x = cx - (cx - x) * (next / zoom);
    y = cy - (cy - y) * (next / zoom);
    zoom = next;
    place();
};
const show = (index) => {
    at = (index + media.length) % media.length;
    const from = media[at];
    stage.replaceChildren();
    stage.classList.toggle('video', Boolean(from.dataset.video));
    if (from.dataset.video) {
        const video = Object.assign(document.createElement('video'), { src: from.dataset.video, controls: true, autoplay: true });
        stage.append(video);
    } else {
        const drawing = from.querySelector('svg, img').cloneNode(true);
        drawing.removeAttribute('style');
        if (drawing.tagName === 'svg') { drawing.removeAttribute('width'); drawing.removeAttribute('height'); }
        stage.append(drawing);
    }
    viewer.querySelector('.caption').textContent = from.dataset.caption || '';
    viewer.querySelector('.count').textContent = media.length > 1 ? at + 1 + ' / ' + media.length : '';
    viewer.querySelectorAll('.side').forEach((button) => (button.hidden = media.length < 2));
    viewer.querySelectorAll('[data-do="in"], [data-do="out"], [data-do="fit"]').forEach((button) => (button.disabled = Boolean(from.dataset.video)));
    fit();
    viewer.classList.add('open');
    document.body.style.overflow = 'hidden';
};
const close = () => { viewer.classList.remove('open'); stage.replaceChildren(); document.body.style.overflow = ''; media[at]?.focus?.(); };
const save = () => {
    const shown = stage.firstElementChild;
    if (!shown) return;
    const href = shown.tagName === 'svg'
        ? URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(shown)], { type: 'image/svg+xml' }))
        : shown.src;
    const name = 'guided-review-' + (at + 1) + (shown.tagName === 'svg' ? '.svg' : shown.tagName === 'VIDEO' ? '' : '.png');
    Object.assign(document.createElement('a'), { href, download: name }).click();
};
const actions = { close, fit, save, in: () => scale(1.4), out: () => scale(1 / 1.4), prev: () => show(at - 1), next: () => show(at + 1) };
media.forEach((one, index) => {
    const open = (event) => { if (event.target.closest('video')) return; show(index); };
    one.addEventListener('click', open);
    one.addEventListener('keydown', (event) => { if (event.key === 'Enter') show(index); });
    one.parentElement.querySelector('.expand')?.addEventListener('click', () => show(index));
});
viewer.addEventListener('click', (event) => {
    const action = event.target.closest('[data-do]')?.dataset.do;
    if (action) actions[action]();
});
stage.addEventListener('wheel', (event) => {
    if (stage.classList.contains('video')) return;
    event.preventDefault();
    const box = stage.getBoundingClientRect();
    scale(Math.exp(-event.deltaY * 0.0022), event.clientX - box.left - box.width / 2, event.clientY - box.top - box.height / 2);
}, { passive: false });
stage.addEventListener('pointerdown', (event) => {
    if (stage.classList.contains('video')) return;
    const from = { x: event.clientX - x, y: event.clientY - y };
    stage.classList.add('dragging');
    stage.setPointerCapture(event.pointerId);
    const move = (moved) => { x = moved.clientX - from.x; y = moved.clientY - from.y; place(); };
    const up = () => { stage.classList.remove('dragging'); stage.removeEventListener('pointermove', move); stage.removeEventListener('pointerup', up); };
    stage.addEventListener('pointermove', move);
    stage.addEventListener('pointerup', up);
});
stage.addEventListener('dblclick', () => (zoom === 1 ? scale(2.2) : fit()));
document.addEventListener('keydown', (event) => {
    if (!viewer.classList.contains('open')) return;
    const key = { Escape: 'close', ArrowLeft: 'prev', ArrowRight: 'next', '+': 'in', '=': 'in', '-': 'out', 0: 'fit' }[event.key];
    if (key) { event.preventDefault(); actions[key](); }
});

// Dragging the bar between the card and the diff resizes them; each layout remembers its own split.
const work = document.querySelector('.work');
const bar = document.querySelector('.split');
try {
    for (const name of ['--split', '--splitv']) { const kept = localStorage.getItem('guided-review' + name); if (kept) work.style.setProperty(name, kept); }
} catch {}
bar.addEventListener('pointerdown', (event) => {
    event.preventDefault();
    bar.setPointerCapture(event.pointerId);
    bar.classList.add('dragging');
    const move = (moved) => {
        const box = work.getBoundingClientRect();
        const side = work.classList.contains('side');
        const share = side ? (moved.clientX - box.left) / box.width : (moved.clientY - box.top) / box.height;
        const name = side ? '--split' : '--splitv';
        const value = Math.round(Math.max(18, Math.min(82, share * 100)) * 10) / 10 + '%';
        work.style.setProperty(name, value);
        try { localStorage.setItem('guided-review' + name, value); } catch {}
    };
    const up = () => { bar.classList.remove('dragging'); bar.removeEventListener('pointermove', move); bar.removeEventListener('pointerup', up); };
    bar.addEventListener('pointermove', move);
    bar.addEventListener('pointerup', up);
});
bar.addEventListener('dblclick', () => { for (const name of ['--split', '--splitv']) { work.style.removeProperty(name); try { localStorage.removeItem('guided-review' + name); } catch {} } });

// The keys are revui's. What needs revui itself (marking, commenting, asking an agent, publishing) is listed in
// the help as such.
const help = document.querySelector('.keysheet');
const statsSheet = document.querySelector('.stats');
document.querySelector('[data-stats]').addEventListener('click', () => statsSheet.classList.add('open'));
statsSheet.addEventListener('click', (event) => { if (event.target === statsSheet) statsSheet.classList.remove('open'); });
let focus = 1;
let picked = 0;
const panes = () => {
    const step = steps[now];
    const joined = document.querySelector('.work').classList.contains('side') && step.dataset.part !== undefined;
    const column = document.querySelector('.frame > .rail');
    return [column.offsetParent ? column : null, joined ? step : step.querySelector('.text'), document.querySelector('.below:not(.empty) .partdiff.on'), joined ? null : step.querySelector('.aside')].filter(Boolean);
};
const point = () => {
    document.querySelectorAll('.focus').forEach((pane) => pane.classList.remove('focus'));
    const all = panes();
    focus = Math.min(focus, all.length - 1);
    if (all.length > 1) all[focus].classList.add('focus');
    return all[focus];
};
const choose = (to) => {
    const links = [...contents.querySelectorAll('a')];
    picked = Math.max(0, Math.min(links.length - 1, to));
    links.forEach((link, at) => link.classList.toggle('pick', at === picked));
    links[picked].scrollIntoView({ block: 'nearest' });
};
// In the diff, one line is selected at a time: j and k move it, o opens it on the code host.
let cursor = 0;
const lines = () => [...(document.querySelector('.partdiff.on')?.querySelectorAll('.line:not(.at)') ?? [])];
const select = (to, quiet) => {
    const all = lines();
    document.querySelectorAll('.line.cur').forEach((line) => line.classList.remove('cur'));
    if (!all.length) return;
    cursor = Math.max(0, Math.min(all.length - 1, to));
    all[cursor].classList.add('cur');
    if (!quiet) all[cursor].scrollIntoView({ block: 'nearest' });
};
const address = (line) => {
    const file = line.closest('.file').querySelector('.path').textContent;
    return hosted(line.dataset.n ?? file);
};
const evidence = () => [...steps[now].querySelectorAll('.media, details')];
let shown = -1;
const settled = go;
go = (index) => {
    settled(index);
    shown = -1;
    point();
    select(Math.max(0, lines().findIndex((line) => line.classList.contains('mark'))), true);
};
point();
document.addEventListener('keydown', (event) => {
    if (viewer.classList.contains('open') || event.metaKey || event.ctrlKey || event.altKey) return;
    const key = event.key;
    if (statsSheet.classList.contains('open')) { if (['Escape', 'q', 'S'].includes(key)) statsSheet.classList.remove('open'); return; }
    if (help.classList.contains('open')) { if (['Escape', 'q', '?', '/'].includes(key)) help.classList.remove('open'); return; }
    if (contents.classList.contains('open')) {
        if (key === 'j' || key === 'ArrowDown') choose(picked + 1);
        else if (key === 'k' || key === 'ArrowUp') choose(picked - 1);
        else if (key === 'Enter' || key === 'l' || key === 'ArrowRight') go(picked);
        else if (key === 'Escape' || key === 'q' || key === 'b') contents.classList.remove('open');
        else return;
        event.preventDefault();
        return;
    }
    const pane = point();
    const line = 66;
    if (key === 'l' || key === 'ArrowRight') go(now + 1);
    else if (key === 'h' || key === 'ArrowLeft') go(now - 1);
    else if (pane.classList.contains('partdiff') && (key === 'j' || key === 'ArrowDown')) select(cursor + 1);
    else if (pane.classList.contains('partdiff') && (key === 'k' || key === 'ArrowUp')) select(cursor - 1);
    else if (pane.classList.contains('partdiff') && (key === 'u' || key === 'PageDown')) select(cursor + 20);
    else if (pane.classList.contains('partdiff') && (key === 'U' || key === 'PageUp')) select(cursor - 20);
    else if (pane.classList.contains('partdiff') && (key === 'o' || key === 'Enter')) { const line = lines()[cursor]; if (line && root.dataset.blob) window.open(address(line), '_blank', 'noopener'); }
    else if (pane.classList.contains('rail') && (key === 'j' || key === 'ArrowDown')) go(now + 1);
    else if (pane.classList.contains('rail') && (key === 'k' || key === 'ArrowUp')) go(now - 1);
    else if (key === 'j' || key === 'ArrowDown') pane.scrollBy({ top: line });
    else if (key === 'k' || key === 'ArrowUp') pane.scrollBy({ top: -line });
    else if (key === 'u' || key === 'PageDown') pane.scrollBy({ top: pane.clientHeight * 0.85 });
    else if (key === 'U' || key === 'PageUp') pane.scrollBy({ top: -pane.clientHeight * 0.85 });
    else if (key === 'Tab') { focus = (focus + (event.shiftKey ? panes().length - 1 : 1)) % panes().length; point(); }
    else if (key === 'b') { contents.classList.toggle('open'); choose(now); }
    else if (key === 'B') fold();
    else if (key === 'd') { layout = layouts[layout] === 'off' ? 0 : 2; turn(0); }
    else if (key === 's') { layout = layouts[layout] === 'side' ? 1 : 0; turn(0); }
    else if (key === 'e') {
        const all = evidence();
        if (!all.length) return;
        shown = (shown + 1) % all.length;
        if (all[shown].tagName === 'DETAILS') all[shown].open = true;
        all[shown].scrollIntoView({ block: 'center' });
    }
    else if (key === ' ') {
        const all = evidence();
        if (!all.length) return;
        shown = Math.max(0, shown);
        if (all[shown].tagName === 'DETAILS') all[shown].open = !all[shown].open;
        else show(media.indexOf(all[shown]));
    }
    else if (key === 'z') { const first = media.indexOf(evidence().filter((one) => one.classList.contains('media'))[Math.max(0, shown)] ?? steps[now].querySelector('.media')); if (first >= 0) show(first); }
    else if (key === 'm') { const link = document.querySelector('.title .ref'); if (link) window.open(link.href, '_blank', 'noopener'); }
    else if (key === 'o' || key === 'Enter') { const at = steps[now].dataset.at; if (at && root.dataset.blob) window.open(hosted(at), '_blank', 'noopener'); }
    else if (key === '?' || key === '/') help.classList.add('open');
    else if (key === 'S') statsSheet.classList.add('open');
    else if (key === 'Escape') contents.classList.remove('open');
    else return;
    event.preventDefault();
});
document.querySelector('.frame').addEventListener('pointerdown', (event) => {
    const at = panes().findIndex((pane) => pane.contains(event.target));
    if (at >= 0) { focus = at; point(); }
});
below.addEventListener('click', (event) => {
    const line = event.target.closest('.line:not(.at)');
    if (!line) return;
    select(lines().indexOf(line), true);
    if (event.target.closest('i') && root.dataset.blob) window.open(address(line), '_blank', 'noopener');
});
help.addEventListener('click', (event) => { if (event.target === help) help.classList.remove('open'); });
document.querySelector('.keys').addEventListener('click', (event) => { if (event.target.closest('[data-help]')) help.classList.add('open'); });
</script>
</body>
</html>
